services:
  db:
    image: mysql:8.0
    container_name: foodplanner-db
    restart: always
    environment:
      MYSQL_DATABASE: food_planner
      MYSQL_USER: foodapi
      MYSQL_PASSWORD: 1111
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: foodplanner-app
    restart: always
    depends_on:
      - db
    environment:
      SECRET_KEY: supersecretkey
      SQLALCHEMY_DATABASE_URI: mysql+pymysql://foodapi:1111@db:3306/food_planner
    ports:
      - "5000:5000"
    command: >
      sh -c "
      flask --app food_planner_app:create_app db upgrade &&
      gunicorn -w 4 -b 0.0.0.0:5000 'food_planner_app:create_app()'
      "
volumes:
  mysql_data:

