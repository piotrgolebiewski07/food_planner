services:
  db:
    image: mysql:8.0
    container_name: foodplanner-db
    restart: always
    environment:
      MYSQL_DATABASE: food_planner
      MYSQL_USER: foodapi
      MYSQL_PASSWORD: 1111
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: foodplanner-app
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5000:5000"
    command: gunicorn -w 4 -b 0.0.0.0:5000 "food_planner_app:create_app()"

volumes:
  mysql_data:

